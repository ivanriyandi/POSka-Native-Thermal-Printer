
name: Build APK POSka Native Bluetooth

on:
  workflow_dispatch:
  push:
    paths:
      - 'POSka_Native_Printer.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil proyek dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak proyek POSka
        run: |
          mkdir extracted
          unzip -q POSka_Native_Printer.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Bangun APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: POSka-Native-Bluetooth-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
